name: OpsPilot CI
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -r requirements-dev.txt
      - run: ruff check opspilot tests
      - run: python -m compileall -q opspilot
      - run: python -m pytest -q
      - run: python -m pip_audit
      - run: docker build -t opspilot:ci .
      - run: docker run -d --name opspilot-ci -p 127.0.0.1:18020:8000 -e DEMO_MODE=true opspilot:ci
      - run: python tests/smoke_app.py --url http://127.0.0.1:18020
      - if: failure()
        run: docker logs opspilot-ci
      - if: always()
        run: docker rm -f opspilot-ci || true
